<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Campus Library</title>
  <link rel="icon" href="static/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="layout-plain"><div style="position:fixed;bottom:12px;right:12px;z-index:200;background:#0f1f3d;color:#fff;font:600 12px/1.4 Segoe UI,Arial,sans-serif;padding:8px 12px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)">Design preview &middot; not connected to the database &middot; <a href="index.html" style="color:#f1d98a">all pages</a></div>



<div class="main">
  

  <main class="content" id="content">
    
      
    

    
<div class="auth-wrap">
  <section class="auth-card">
    <div class="auth-brand">
      <img src="static/images/logo.svg" alt="" width="56" height="56">
      <h1>Campus Library</h1>
      <p>Book Management System · Librarian sign in</p>
    </div>

    

    <form method="get" action="#" class="form" novalidate data-validate>
      <input type="hidden" name="csrf_token" value="">

      <div class="field">
        <label for="username">Username</label>
        <div class="input-icon">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          <input id="username" name="username" type="text" value="" required
                 autocomplete="username" autofocus maxlength="50">
        </div>
        <p class="field-error" data-error-for="username"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-icon has-toggle">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="password" name="password" type="password" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-password-toggle aria-controls="password"
                  aria-label="Show password" aria-pressed="false" title="Show password">
            <span class="when-hidden"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></span>
            <span class="when-shown"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/></svg></span>
          </button>
        </div>
        <p class="field-error" data-error-for="password"></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="auth-hint">Demo accounts: <code>admin</code> / <code>admin123</code> (can delete) ·
      <code>librarian</code> / <code>library123</code></p>
  </section>
</div>

  </main>

  <footer class="footer">
    &copy; 2026 Campus Library · Library Book Management System
  </footer>
</div>



<script src="static/js/script.js" defer></script>
</body>
</html>
